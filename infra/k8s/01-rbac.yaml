apiVersion: v1
kind: ServiceAccount
metadata:
  name: chaos-backend-sa
  namespace: chaos-testing
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: chaos-backend-controller
  namespace: chaos-testing
rules:
  - apiGroups: ["chaos-mesh.org"]
    resources: ["podchaoses", "networkchaoses"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: chaos-backend-controller
  namespace: chaos-testing
subjects:
  - kind: ServiceAccount
    name: chaos-backend-sa
    namespace: chaos-testing
roleRef:
  kind: Role
  name: chaos-backend-controller
  apiGroup: rbac.authorization.k8s.io
