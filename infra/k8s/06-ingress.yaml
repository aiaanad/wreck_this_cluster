apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chaos-play
  namespace: chaos-testing
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # ограничение по количеству запросов в секунду
    nginx.ingress.kubernetes.io/limit-rps: "2"
    nginx.ingress.kubernetes.io/limit-burst: "5"
    nginx.ingress.kubernetes.io/limit-connections: "5"
    nginx.ingress.kubernetes.io/proxy-body-size: "16k"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "5"
    # WebSocket — важно для /ws/logs
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  metadata:
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    - hosts:
        - app.188.93.54.160.nip.io
      secretName: app-tls
  rules:
    - host: app.188.93.54.160.nip.io
      http:
        paths:
          - path: /api/play
            pathType: Prefix
            backend:
              service:
                name: chaos-backend
                port: { number: 8000 }
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: chaos-backend
                port: { number: 8000 }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: chaos-frontend
                port: { number: 80 }