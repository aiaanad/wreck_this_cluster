apiVersion: apps/v1
kind: Deployment
metadata:
  name: chaos-backend
  namespace: chaos-testing
  labels:
    app: chaos-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chaos-backend
  template:
    metadata:
      labels:
        app: chaos-backend
    spec:
      # предоставляем токен сервис аккаунта из rbac
      serviceAccountName: chaos-backend-sa
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: chaos-backend
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: registry.mwsapis.ru/project-danilovaajaana/wtc-registry/backend
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: REDIS_URL
              value: redis://redis-service.chaos-testing.svc.cluster.local:6379
            - name: K8S_NAMESPACE
              value: chaos-testing
            - name: CHANNEL_NAME
              value: cluster_logs
            - name: TARGET_APP
              value: chaos-app
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: chaos-backend
  namespace: chaos-testing
spec:
  selector:
    app: chaos-backend
  ports:
    - name: http
      port: 8000
      targetPort: http
