apiVersion: apps/v1
kind: Deployment
metadata:
  name: chaos-app
  labels:
    app: chaos-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chaos-app
  template:
    metadata:
      labels:
        app: chaos-app
    spec:
      containers:
      - name: web
        image: chaos-app:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
---
apiVersion: v1
kind: Service
metadata:
  name: chaos-app-service
spec:
  type: NodePort
  selector:
    app: chaos-app
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
      nodePort: 30080